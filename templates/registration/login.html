{% extends "base.html" %}
{% block title %}Entrar — Gestão Social{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card p-4">
    <h1 class="h3 mb-2">Acessar o sistema</h1>
    <p class="text-secondary">Gestão Social — ONG Esperança Viva</p>
    {% if form.errors %}<div class="alert alert-danger" role="alert">Usuário ou senha inválidos. Confira os dados e tente novamente.</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label" for="id_username">Usuário</label><input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus></div>
      <div class="mb-3"><label class="form-label" for="id_password">Senha</label><input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-success w-100" type="submit">Entrar</button>
    </form>
  </div>
</div></div>
{% endblock %}
