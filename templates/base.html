<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Gestão Social — Esperança Viva{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f7f5; }
    .navbar-brand { font-weight: 700; }
    .btn, .form-control, .form-select { min-height: 44px; }
    .form-check-input { width: 1.2em; height: 1.2em; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #f0ad4e; outline-offset: 2px; }
    .card { border: 0; box-shadow: 0 2px 12px rgba(0,0,0,.05); }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#075b43">
  <div class="container">
    <a class="navbar-brand" href="{% url 'core:people_list' %}">Gestão Social</a>
    {% if user.is_authenticated %}
      <div class="d-flex align-items-center gap-3">
        <span class="text-white small">Olá, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm" type="submit">Sair</button></form>
      </div>
    {% endif %}
  </div>
</nav>
<main class="container py-4">
  {% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}" role="status">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<footer class="container py-4 text-center text-secondary small">Projeto acadêmico — ONG Esperança Viva · Utilize somente dados fictícios durante os testes.</footer>
</body>
</html>
